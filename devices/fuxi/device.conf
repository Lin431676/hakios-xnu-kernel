# devices/fuxi/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/fuxi.md) is made from it, so that the status is said in one place.

device fuxi
	title       Xiaomi 13
	vendor      Xiaomi
	soc         sm8550
	defconfig   fuxi_defconfig
	firmware    pull-firmware.sh
	maintainer  fuxi port (work-in-progress)
	status      display     missing   the panel through UEFI's framebuffer (to bring up)
	status      touch       missing   ST FTM5 (a driver is still to be ported; OddlyLabs/unixnu-fuxi has a reference)
	status      buttons     missing   power and volume through the PMIC (to bring up)
	status      cpu         missing   all 8 cores (CPU0-2 A510, CPU3-4 A715, CPU5-6 A710, CPU7 X3); SMP to bring up
	status      gpu         missing   Adreno 740 (firmware in fw/gpu/, driver to port from ShengGmu + a6xx->a7xx)
	status      storage     missing   UFS 4.0 through the loader (to bring up)
	status      audio       missing   to bring up
	status      battery     missing   to bring up
	status      haptic      missing   to bring up
	status      camera      missing   to bring up
	status      torch       missing   to bring up
	status      wifi        missing   WCN685x (ath11k/ath12k; to bring up)
	status      bluetooth   missing   to bring up
	status      cellular    missing   to bring up
	status      thermal     missing   to bring up
