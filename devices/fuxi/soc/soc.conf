# socs/sm8550/soc.conf: what this SoC repository is: the facts of a Qualcomm SM8550-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8550.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8550
	title       Qualcomm SM8550 family ("Snapdragon 8 Gen 2", "kalama")
	vendor      Qualcomm
	cores       8, the biggest is core 7 (CPU0-2 A510, CPU3-4 A715, CPU5-6 A710, CPU7 Cortex-X3)
	gpu         Adreno 740
	maintainer  fuxi port (work-in-progress)
